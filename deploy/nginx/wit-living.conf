# 放在 Nginx http {} 中；根据实际安装位置修改 root。
server {
    listen 8080;
    server_name localhost;
    root D:/Nirvana/Wit_Living/frontend;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
